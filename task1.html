<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Train Ticket</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="ticket-page">
  <div class="container py-4 py-md-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-9">
        <div class="ticket-card">
          <h2>Book a train ticket</h2>
          <form class="p-3 p-md-4">
            <div class="mb-3">
              <input class="btn-check" type="radio" name="trip" id="oneway" value="oneway">
              <label class="btn trip-btn" for="oneway">One way</label><input class="btn-check" type="radio" name="trip" id="roundtrip" value="roundtrip">
              <label class="btn trip-btn" for="roundtrip">Round trip</label>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-md-6">
                <div class="place-field">
                  <label for="from">From</label>
                  <input class="form-control" type="text" id="from" name="from" placeholder="Astana" required>
                </div>
              </div>
              <div class="col-md-6">
                <div class="place-field">
                  <label for="to">To</label>
                  <input class="form-control" type="text" id="to" name="to" placeholder="Almaty" required>
                </div>
              </div>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-md-4">
                <label class="form-label" for="departure">Departure</label>
                <input class="form-control" type="date" id="departure" name="departure" required>
              </div>
              <div class="col-md-4">
                <label class="form-label" for="return">Return</label>
                <input class="form-control" type="date" id="return" name="return">
              </div>
              <div class="col-md-4">
                <label class="form-label" for="passengers">Passengers</label>
                <select class="form-select" id="passengers" name="passengers" required>
                  <option value="" selected>Choose adults</option>
                  <option value="1">1 adult</option>
                  <option value="2">2 adults</option>
                  <option value="3">3 adults</option>
                  <option value="4">4 adults</option>
                  <option value="5">5 adults</option>
                  <option value="6">6 adults</option>
                </select>
              </div>
            </div>

            <fieldset class="mb-3">
              <legend class="form-label">Carriage class</legend>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="carriage" id="seat" value="seat" required>
                <label class="form-check-label" for="seat">Seat</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="carriage" id="coupe" value="coupe">
                <label class="form-check-label" for="coupe">Coupé</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="carriage" id="sleeper" value="sleeper">
                <label class="form-check-label" for="sleeper">Sleeper</label>
              </div>
            </fieldset>

            <div class="row g-2 mb-3">
              <div class="col-md-6">
                <label class="form-label" for="phone">Phone</label>
                <div class="input-group">
                  <span class="input-group-text">+7</span>
                  <input class="form-control" type="tel" id="phone" name="phone" placeholder="701 234 56 78" required>
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" type="email" id="email" name="email" placeholder="name@example.com" required>
              </div>
            </div>

            <div class="form-check form-switch mb-2">
              <input class="form-check-input" type="checkbox" role="switch" id="sms" name="sms">
              <label class="form-check-label" for="sms">Also send the ticket by SMS</label>
            </div>
            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="agreement" name="agreement" required>
              <label class="form-check-label" for="agreement">I agree with the carriage rules</label>
            </div>

            <div class="d-flex flex-column-reverse flex-md-row justify-content-md-end gap-2">
              <button type="reset" class="btn clear-btn">Clear</button>
              <button type="submit" class="btn find-btn">Find trains</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
